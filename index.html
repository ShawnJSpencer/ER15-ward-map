<style>
:root{--ink:#1d2329;--muted:#66707a;--line:#d9dee3;--bg:#f3f5f7;--accent:#1f6feb;--accent-weak:#e7f0ff;--danger:#c62828;--panel:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.4 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f8fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:#efc4c4}
.btn.small{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
#search{width:220px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
#searchWrap{position:relative}
#results{position:absolute;top:36px;left:0;width:300px;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;display:none}
#results div{padding:6px 10px;cursor:pointer;border-bottom:1px solid #f0f2f4}
#results div:hover{background:var(--accent-weak)}
#results small{color:var(--muted)}
main{display:grid;grid-template-columns:1fr 340px;min-height:0}
#stage{position:relative;overflow:hidden;background:#e9ecef;cursor:default}
#stage.drawing{cursor:crosshair}
#stage.panning{cursor:grabbing}
#svgwrap{position:absolute;inset:0}
#map{width:100%;height:100%;display:block;user-select:none}
#zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoomctl .btn{width:36px;height:36px;padding:0;font-size:18px}
#hint{position:absolute;left:12px;bottom:12px;background:rgba(29,35,41,.85);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;display:none;max-width:60%}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}
aside h2{font-size:15px;margin:0 0 10px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.field label{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=date],.field input[type=number],.field select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:100%}
.row{display:flex;gap:6px;align-items:center}
.row > *{flex:1}
.fam{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfcfd}
.fam.base{border-style:dashed}
.fam .tools{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.status label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.muted{color:var(--muted);font-size:13px}
.note{background:#fff8e1;border:1px solid #f3e1a5;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.kbd{font-family:Consolas,monospace;background:#f0f2f4;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#1d2329;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:50}
.menu{position:relative}
.menu .items{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;z-index:30;min-width:230px;padding:4px}
.menu .items button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu .items button:hover{background:var(--accent-weak)}
.menu.open .items{display:block}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
/* map styles */
.lot{fill:transparent;cursor:pointer}
.lot:hover{fill:rgba(31,111,235,.07)}
.sel{fill:rgba(31,111,235,.12);stroke:#1f6feb;stroke-width:6;pointer-events:none}
.match{fill:rgba(255,193,7,.28);pointer-events:none}
.drag{cursor:move}
#printArea{display:none}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  #app,#toast{display:none!important}
  #printArea{display:block}
  #printArea svg{width:8.5in;height:11in;display:block;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Elk Ridge 15th Ward Map</h1>
  <div class="seg" id="pageTabs"></div>
  <div id="searchWrap"><input id="search" type="search" placeholder="Find a name or house #…" autocomplete="off"><div id="results"></div></div>
  <div class="seg" id="modes">
    <button data-mode="select" class="on" title="Click a home to edit it. Drag names, numbers or street labels to move them.">Edit</button>
    <button data-mode="draw" title="Draw a new lot by clicking its corners">Draw lot</button>
    <button data-mode="street" title="Click on the map to add a street name">Add street name</button>
  </div>
  <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button class="btn" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
  <div class="spacer"></div>
  <span id="saveState"></span>
  <button class="btn" id="fileLink" style="display:none"></button>
  <button class="btn primary" id="exportPdf">Export PDF</button>
  <div class="menu" id="fileMenu">
    <button class="btn" id="fileBtn">Backup ▾</button>
    <div class="items">
      <button id="saveBackup">Save backup file… <span class="kbd">Ctrl+S</span></button>
      <button id="openBackup">Open backup file…</button>
      <button id="printBtn">Print…</button>
      <button id="openData">Open a different data file…</button>
      <button id="newData">Create a new data file…</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>
<main>
  <div id="stage"><div id="svgwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="zoomctl"><button class="btn" id="zin" title="Zoom in">+</button><button class="btn" id="zout" title="Zoom out">−</button><button class="btn" id="zfit" title="Fit page" style="font-size:13px">Fit</button></div>
    <div id="hint"></div>
    <div id="connect" style="display:none;position:absolute;inset:0;background:rgba(233,236,239,.82);align-items:center;justify-content:center;z-index:5">
      <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 26px;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.12)">
        <h2 style="margin:0 0 8px;font-size:18px">Open your ward data</h2>
        <p id="connectMsg" class="muted" style="font-size:14px;margin:0 0 16px"></p>
        <button class="btn primary" id="connectGo" style="width:100%;padding:10px"></button>
        <p class="muted" style="margin:14px 0 0">First time on this computer? <a href="#" id="connectNew">Create a new data file</a></p>
      </div></div>
  </div>
  <aside id="panel"></aside>
</main>
</div>
<div id="printArea"></div>

    if(size<minSize)size=minSize;
    const top=ay-blk.H/2;
    for(const l of blk.lines){runs.push({t:l.t,x:ax,y:top+l.y+size*0.74,size,b:l.b,i:l.i,anchor:'middle',det});}
    return {x0:ax-blk.W/2,x1:ax+blk.W/2,y0:top,y1:top+blk.H};
  };
  let box=null;
  if(main.length){
    const mark=runs.length;
    box=fit(main,anchor.x,anchor.y,lot.fontSize,lot.wrap,true);
    const got=runs.length>mark?runs[mark].size:SZ.name;
    if(!lot.fontSize&&got<SZ.name-2){ // try nudging the names a little to fit bigger text
      let best={size:got,dx:0,dy:0};
      for(let dy=-60;dy<=60;dy+=20)for(let dx=-60;dx<=60;dx+=20){if(!dx&&!dy)continue;const x=anchor.x+dx,y=anchor.y+dy;if(!pip(x,y,lot.poly))continue;
        const tmp=runs.length;fit(main,x,y,undefined,lot.wrap,true);const sz=runs[tmp]?runs[tmp].size:0;runs.length=tmp;
        if(sz>best.size+1||(sz>=best.size&&sz>got&&Math.hypot(dx,dy)<Math.hypot(best.dx,best.dy)))best={size:sz,dx,dy};}
      if(best.size>got){runs.length=mark;box=fit(main,anchor.x+best.dx,anchor.y+best.dy,undefined,lot.wrap,true);}
    }
  }
  else if(lot.status==='w12'||lot.status==='page1'){
    const t=lot.status==='w12'?'12th Ward':'See Page 1';const v=lot.label||visualCenter(lot);const c=chordX(lot.poly,v.y,v.x);
    const room=c?(c[1]-c[0])-10:999;let done=false;
    for(let sz=SZ.tag;sz>=14&&!done;sz--){
      if(textW(t,sz,false)<=room){runs.push({t,x:v.x,y:v.y+sz*0.36,size:sz,b:false,i:true,anchor:'middle',color:'#555'});done=true;}
      else{const parts=t==='12th Ward'?['12th','Ward']:['See','Page 1'];
        if(Math.max(...parts.map(p=>textW(p,sz,false)))<=room){parts.forEach((p,k)=>runs.push({t:p,x:v.x,y:v.y+sz*0.36+(k-0.5)*sz*1.1,size:sz,b:false,i:true,anchor:'middle',color:'#555'}));done=true;}}
    }
  }
  lot.households.forEach((h,k)=>{if(!(h.pos&&(h.first||h.last)))return;
    const r=fit([h],h.pos.x,h.pos.y,lot.fontSize,lot.wrap||360,false,k);
    if(!pip(h.pos.x,h.pos.y,lot.poly)){ // arrow from block to lot
      const cx=(r.x0+r.x1)/2;let best=null;
      for(let i=0,j=lot.poly.length-1;i<lot.poly.length;j=i++){const s=segDist(cx,(r.y0+r.y1)/2,lot.poly[j],lot.poly[i]);if(!best||s[0]<best[0])best=s;}
      const tx=best[1],ty=best[2];const vc=visualCenter(lot);const dx=vc.x-tx,dy=vc.y-ty,dl=Math.hypot(dx,dy)||1;
      const ex=tx+dx/dl*18,ey=ty+dy/dl*18;
      const sy=ey<r.y0?r.y0-8:(ey>r.y1?r.y1+6:(r.y0+r.y1)/2);const sx=Math.max(r.x0,Math.min(r.x1,ex));
      arrows.push({x1:sx,y1:sy,x2:ex,y2:ey});
    }
  });
  return {runs,arrows,box};
}

// ---------- rendering (SVG) ----------
function polyPath(p){return 'M'+p.map(q=>q[0]+' '+q[1]).join('L')+'Z';}
function runSVG(r,extra=''){
  const st=`font-size:${r.size.toFixed(1)}px;font-weight:${r.b?700:400};font-style:${r.i?'italic':'normal'}`;
  return `<text x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" text-anchor="${r.anchor||'middle'}" style="${st}" fill="${r.color||'#000'}" ${extra}>${esc(r.t)}</text>`;}
function arrowSVG(a){const ang=Math.atan2(a.y2-a.y1,a.x2-a.x1);const L=16,W=8;
  const p1=[a.x2-L*Math.cos(ang)+W*Math.sin(ang),a.y2-L*Math.sin(ang)-W*Math.cos(ang)],p2=[a.x2-L*Math.cos(ang)-W*Math.sin(ang),a.y2-L*Math.sin(ang)+W*Math.cos(ang)];
  return `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#000" stroke-width="3"/><path d="M${a.x2} ${a.y2}L${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}Z"/>`;}
function numberRun(n){return {t:n.text,size:n.size||SZ.num,b:false,i:false};}
function pageSVG(pg,{interactive=true}={}){
  const o=[];
  o.push(`<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(45)"><rect width="22" height="22" fill="#fff"/><line x1="0" y1="0" x2="0" y2="22" stroke="#9aa0a6" stroke-width="3"/></pattern></defs>`);
  o.push(`<rect x="0" y="0" width="2550" height="3300" fill="#fff"/>`);
  for(const L of pg.lots){
    if(L.status==='w12')o.push(`<path d="${polyPath(L.poly)}" fill="#e3e3e3"/>`);
    else if(L.status==='page1')o.push(`<path d="${polyPath(L.poly)}" fill="#e3e3e3"/>`);
  }
  for(const im of pg.images||[])o.push(`<image href="${im.src}" x="${im.x}" y="${im.y}" width="${im.w}" height="${im.h}"/>`);
  for(const w of pg.water||[]){o.push(`<path d="${polyPath(w.poly)}" fill="#d7e9f7"/>`);
    o.push(`<g fill="none" stroke="#3a6f99" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${w.waves.map(v=>`<polyline points="${v.map(q=>q.join(',')).join(' ')}"/>`).join('')}</g>`);
    o.push(`<path d="${polyPath(w.poly)}" fill="none" stroke="#000" stroke-width="${LINE_W}" stroke-linejoin="round"/>`);}
  o.push(pg.artStroke?`<path d="${pg.art}" fill="none" stroke="#000" stroke-width="${LINE_W}" stroke-linejoin="round" stroke-linecap="round"/>`:`<path d="${pg.art}" fill="#000" fill-rule="evenodd"/>`);
  const drawn=pg.lots.filter(l=>l.drawn);
  if(drawn.length)o.push(`<g fill="none" stroke="#000" stroke-width="${LINE_W}" stroke-linejoin="round" stroke-linecap="round">${drawn.map(l=>`<path d="${polyPath(l.poly)}"/>`).join('')}</g>`);
  o.push(`<g style="font-family:${FONT.replace(/"/g,"'")}">`);
  // lot hit areas + highlights
  if(interactive){
    for(const L of pg.lots){if(matches.has(L))o.push(`<path class="match" d="${polyPath(L.poly)}"/>`);}
    for(const L of pg.lots)o.push(`<path class="lot" data-lot="${L.id}" d="${polyPath(L.poly)}"/>`);
    if(sel){const L=pg.lots.find(l=>l.id===sel);if(L)o.push(`<path class="sel" d="${polyPath(L.poly)}"/>`);}
  }
  for(const L of pg.lots){
    const {runs,arrows,box}=layoutLot(L);
    const mainRuns=runs.filter(r=>r.det===undefined);
    if(interactive&&box)o.push(`<g class="drag" data-drag="label" data-lot="${L.id}">`);else o.push('<g>');
    o.push(mainRuns.map(r=>runSVG(r)).join(''));
    o.push('</g>');
    const dets=[...new Set(runs.filter(r=>r.det!==undefined).map(r=>r.det))];
    for(const k of dets)o.push(`<g ${interactive?`class="drag" data-drag="fam" data-lot="${L.id}" data-k="${k}"`:''}>${runs.filter(r=>r.det===k).map(r=>runSVG(r)).join('')}</g>`);
    for(const a of arrows)o.push(arrowSVG(a));
    if(L.number&&L.number.text){const n=L.number;const r=numberRun(n);
      o.push(`<g transform="translate(${n.x} ${n.y}) rotate(${n.rot||0})" ${interactive?`class="drag" data-drag="num" data-lot="${L.id}"`:''}>${runSVG({...r,x:0,y:r.size*0.36})}</g>`);}
  }
  pg.streets.forEach((s,k)=>{
    o.push(`<g transform="translate(${s.x} ${s.y}) rotate(${s.rot||0})" ${interactive?`class="drag" data-drag="street" data-k="${k}"`:''}>`+
      (interactive&&selStreet===k?`<rect x="${-textW(s.text,s.size||SZ.street,false)/2-8}" y="${-(s.size||SZ.street)*0.6}" width="${textW(s.text,s.size||SZ.street,false)+16}" height="${(s.size||SZ.street)*1.2}" fill="rgba(31,111,235,.12)" stroke="#1f6feb" stroke-width="3"/>`:'')+
      runSVG({t:s.text,x:0,y:(s.size||SZ.street)*0.36,size:s.size||SZ.street,b:false,i:false})+`</g>`);
  });
  const up=pg.updatedPos||{x:2506,y:3266};
  o.push(runSVG({t:'Updated '+fmtDate(pg.updated),x:up.x,y:up.y,size:SZ.updated,b:false,i:false,anchor:'end'}));
  o.push('</g>');
  return o.join('');
}

// ---------- persistence & undo ----------
let saveTimer=null;
function persist(){
  data.savedAt=Date.now();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}
  scheduleFileSave();
}
// ---------- your names live in a data file on your PC ----------
let fileHandle=null,fileState='none',fileTimer=null,fileBusy=false,lastFileSave=null;
const fsOK=typeof window.showOpenFilePicker==='function';
function idb(op,val){return new Promise(res=>{try{const r=indexedDB.open('ward-map-file',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');
  r.onsuccess=()=>{const tx=r.result.transaction('h',op==='get'?'readonly':'readwrite');const st=tx.objectStore('h');let q;try{q=op==='get'?st.get('file'):op==='put'?st.put(val,'file'):st.delete('file');}catch(e){res(null);return;}q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);};r.onerror=()=>res(null);}catch(e){res(null);}});}
const tm=t=>t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function fileUI(){
  const b=$('#fileLink'),st=$('#saveState'),ov=$('#connect');
  if(!fsOK){b.style.display='none';ov.style.display='none';st.textContent='This browser can’t save to a file — use Edge';return;}
  b.style.display='';b.classList.remove('primary');st.textContent='';
  if(fileState==='linked'){b.textContent='✓ Saved'+(lastFileSave?' '+tm(lastFileSave):'');b.title='Your names are saved in “'+fileHandle.name+'” on this computer.';ov.style.display='none';}
  else if(fileState==='saving'){b.textContent='Saving…';}
  else{b.textContent=fileState==='permission'?'Reconnect data file':'Open data file';b.classList.add('primary');
    ov.style.display='flex';
    $('#connectMsg').innerHTML=fileState==='permission'?`Click below to keep using <b>${esc(fileHandle.name)}</b>.`:'Your names are kept in a data file on this computer, not on the internet. Open it to start.';
    $('#connectGo').textContent=fileState==='permission'?'Reconnect “'+fileHandle.name+'”':'Open my data file…';}
}
function scheduleFileSave(){if(!fileHandle||fileState!=='linked')return;clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,400);}
async function ensurePerm(ask){if(!fileHandle)return false;let p='prompt';try{p=await fileHandle.queryPermission({mode:'readwrite'});if(p!=='granted'&&ask)p=await fileHandle.requestPermission({mode:'readwrite'});}catch(e){}return p==='granted';}
async function writeFile(){
  if(!fileHandle)return;if(fileBusy){scheduleFileSave();return;}
  if(!await ensurePerm(false)){fileState='permission';fileUI();return;}
  fileBusy=true;
  try{const w=await fileHandle.createWritable();await w.write(new Blob([JSON.stringify(data)],{type:'application/json'}));await w.close();lastFileSave=new Date();fileState='linked';}
  catch(e){console.error(e);toast('Could not save to the data file: '+e.message);}
  fileBusy=false;fileUI();
}
async function readFile(){
  const t=await (await fileHandle.getFile()).text();
  let d=null;try{d=JSON.parse(t);}catch(e){}
  if(!d||!Array.isArray(d.pages))throw new Error('“'+fileHandle.name+'” is not a Ward Map data file.');
  return d;
}
async function useHandle(h,{fresh=false}={}){
  fileHandle=h;
  if(!await ensurePerm(true)){fileState='permission';fileUI();return;}
  if(fresh){await writeFile();}
  else{
    let d;try{d=await readFile();}catch(e){alert(e.message);fileHandle=null;fileState='none';fileUI();return;}
    if((d.savedAt||0)>=(data.savedAt||0)||!localHasNames()){data=d;undoStack=[];redoStack=[];sel=null;selStreet=null;try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}fit();}
    fileState='linked';
    if((data.savedAt||0)>(d.savedAt||0))await writeFile();
  }
  await idb('put',h);fileState='linked';fileUI();
}
function localHasNames(){return data.pages.some(p=>p.lots.some(l=>l.households.length));}
async function openDataFile(){
  if(fileHandle&&fileState==='permission'){return useHandle(fileHandle);}
  let h;try{[h]=await showOpenFilePicker({id:'wardmap',startIn:'documents',types:[{description:'Ward Map data',accept:{'application/json':['.json']}}]});}catch(e){return;}
  return useHandle(h);
}
async function newDataFile(){
  let h;try{h=await showSaveFilePicker({id:'wardmap',startIn:'documents',suggestedName:'Ward Map data.json',types:[{description:'Ward Map data',accept:{'application/json':['.json']}}]});}catch(e){return;}
  data.savedAt=Date.now();return useHandle(h,{fresh:true});
}
async function linkFile(){if(fileState==='linked'){toast('Saved in “'+fileHandle.name+'” on this computer.');return;}return openDataFile();}
async function initFile(){
  if(!fsOK){fileUI();return;}
  const h=await idb('get');
  if(h){fileHandle=h;
    if(await ensurePerm(false)){try{await useHandle(h);return;}catch(e){}}
    fileState='permission';}
  fileUI();
}
function snapshot(){return JSON.stringify(data.pages.map(p=>({...p,art:undefined,images:undefined,water:undefined})));}
function restore(s){const arr=JSON.parse(s);arr.forEach((p,i)=>{p.art=data.pages[i].art;p.images=data.pages[i].images;p.water=data.pages[i].water;});data.pages=arr;}
function change(fn,{touchDate=true}={}){
  undoStack.push(snapshot());if(undoStack.length>80)undoStack.shift();redoStack=[];
  fn();
  if(touchDate)page().updated=todayISO();
  persist();render();
}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());persist();render();}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());persist();render();}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600);}

function doSearch(q){

    L.households.forEach(h=>{const s=`${h.first} ${h.last}`.toLowerCase();if(s.includes(q))res.push({pi,L,label:`${h.first} ${h.last}`.trim(),num});});

  box.innerHTML=res.length?res.slice(0,60).map((r,i)=>`<div data-i="${i}">${esc(r.label)} <small>· Page ${r.pi+1}${r.num?' · #'+esc(r.num):''}</small></div>`).join(''):'<div class="muted">No matches</div>';

    matches=new Set([r.L]);const b=bbox(r.L.poly);const cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;const k=Math.min(1,900/view.w);view.w*=k;view.h*=k;view.x=cx-view.w/2;view.y=cy-view.h/2;render();});
  render();

// ---------- PDF export (vector, no internet needed) ----------
function pdfStr(s){let o='';for(const ch of s){const c=code(ch);const x=String.fromCharCode(c);o+=(x==='('||x===')'||x==='\\')?'\\'+x:x;}return '('+o+')';}
const f2=v=>(+v).toFixed(2).replace(/\.?0+$/,'')||'0';
function pdfPolyPath(p){return p.map((q,i)=>`${f2(q[0])} ${f2(q[1])} ${i?'l':'m'}`).join(' ')+' h';}
function svgPathToPdf(d){ // only M/L/Z absolute with space separated numbers (our art)
  const out=[];const re=/([MLZ])([^MLZ]*)/g;let m;
  while((m=re.exec(d))){const cmd=m[1];const nums=m[2].trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if(cmd==='Z'){out.push('h');continue;}
    for(let i=0;i+1<nums.length;i+=2){out.push(`${nums[i]} ${nums[i+1]} ${(cmd==='M'&&i===0)?'m':'l'}`);}}
  return out.join('\n');}
function pdfText(r,rotDeg,ox,oy){ // r.x,r.y baseline position (anchor middle/end), optional rotation about (ox,oy)
  const font=r.b?(r.i?'F4':'F2'):(r.i?'F3':'F1');const w=textW(r.t,r.size,r.b);
  let x=r.x,y=r.y;if(r.anchor==='middle')x-=w/2;else if(r.anchor==='end')x-=w;
  const th=(rotDeg||0)*Math.PI/180,c=Math.cos(th),s=Math.sin(th);
  let X=x,Y=y;if(rotDeg){X=ox+x*c-y*s;Y=oy+x*s+y*c;}else if(ox!==undefined){X=ox+x;Y=oy+y;}
  const col=r.color==='#555'?'0.33 g':'0 g';
  return `BT ${col} /${font} ${f2(r.size)} Tf ${f2(c)} ${f2(s)} ${f2(s)} ${f2(-c)} ${f2(X)} ${f2(Y)} Tm ${pdfStr(r.t)} Tj ET`;}
async function imageToPdf(im){
  const img=new Image();img.src=im.src;await img.decode();

  const px=cx.getImageData(0,0,cv.width,cv.height).data;const n=cv.width*cv.height;const rgb=new Uint8Array(n*3),a=new Uint8Array(n);
  for(let i=0;i<n;i++){rgb[i*3]=px[i*4];rgb[i*3+1]=px[i*4+1];rgb[i*3+2]=px[i*4+2];a[i]=px[i*4+3];}

}
async function buildPdf(){

  const enc=new TextEncoder();const latin=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u;};
  const fonts={F1:'Helvetica',F2:'Helvetica-Bold',F3:'Helvetica-Oblique',F4:'Helvetica-BoldOblique'};
  const fontIds={};for(const k in fonts)fontIds[k]=add(`<< /Type /Font /Subtype /Type1 /BaseFont /${fonts[k]} /Encoding /WinAnsiEncoding >>`);
  const pagesId=add(null);const pageIds=[];

    const xo={};const c=[];

      const sm=add({dict:`<< /Type /XObject /Subtype /Image /Width ${d.w} /Height ${d.h} /ColorSpace /DeviceGray /BitsPerComponent 8 ${d.a.f}/Length ${d.a.d.length} >>`,data:d.a.d});
      const id=add({dict:`<< /Type /XObject /Subtype /Image /Width ${d.w} /Height ${d.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /SMask ${sm} 0 R ${d.rgb.f}/Length ${d.rgb.d.length} >>`,data:d.rgb.d});
      xo['Im'+ii]=id;c.push(`q ${im.w} 0 0 ${-im.h} ${im.x} ${im.y+im.h} cm /Im${ii} Do Q`);}

      c.push('0.227 0.435 0.6 RG 4 w 1 j 1 J');for(const v of w.waves)c.push(v.map((q,i)=>`${f2(q[0])} ${f2(q[1])} ${i?'l':'m'}`).join(' ')+' S');

        c.push(`0 g ${f2(a.x2)} ${f2(a.y2)} m ${f2(a.x2-Ln*Math.cos(ang)+W*Math.sin(ang))} ${f2(a.y2-Ln*Math.sin(ang)-W*Math.cos(ang))} l ${f2(a.x2-Ln*Math.cos(ang)-W*Math.sin(ang))} ${f2(a.y2-Ln*Math.sin(ang)+W*Math.cos(ang))} l h f`);}

  }
  objs[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;

  const infoId=add(`<< /Title (Elk Ridge 15th Ward Map) /Producer (Ward Map app) >>`);
  const chunks=[];let len=0;const push=u=>{chunks.push(u);len+=u.length;};
  push(latin('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));const offs=[];

    else{push(latin(`${i+1} 0 obj\n${o.dict}\nstream\n`));push(o.data);push(latin('\nendstream\nendobj\n'));}});
  const xref=len;let x=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(const o of offs)x+=String(o).padStart(10,'0')+' 00000 n \n';
  push(latin(x+`trailer\n<< /Size ${objs.length+1} /Root ${catId} 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(chunks,{type:'application/pdf'});
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}

  window.addEventListener('keydown',e=>{
    const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveBackup();}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();exportPdf();}
    else if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='1'||e.key==='2'||e.key==='`')){e.preventDefault();
      const t=e.key==='`'?(cur+1)%data.pages.length:Math.min(+e.key-1,data.pages.length-1);
      if(t!==cur){cur=t;sel=null;selStreet=null;drawPts=[];doSearch($('#search').value);fit();}}
    else if(e.key==='Escape'){if(mode!=='select')setMode('select');else{sel=null;selStreet=null;render();}}
    else if(e.key==='Enter'&&mode==='draw'){finishDraw();}
    else if(e.key==='Backspace'&&mode==='draw'&&drawPts.length){drawPts.pop();render();}
  });
  window.addEventListener('resize',()=>fit());
  fit();
}
init();
</script>
</body>
</html>
